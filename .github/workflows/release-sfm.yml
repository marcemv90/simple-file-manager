name: Release sfm.war

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.2.3)'
        required: true
        type: string
      release_body:
        description: 'Optional release description to use when manually triggering'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish sfm.war
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.event.release.tag_name }}
      RELEASE_BODY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_body || github.event.release.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B clean package

      - name: Prepare sfm.war artifact
        run: |
          mkdir -p dist
          cp target/*.war dist/sfm.war

      - name: Scan project with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'HIGH,CRITICAL'

      - name: Build release body with Trivy report
        run: |
          if grep -qi "No vulnerabilities" trivy-report.txt || ! grep -qi "CVE" trivy-report.txt; then
            SUMMARY="No known CVEs found for this release at $(date -u '+%Y-%m-%d')"
          else
            SUMMARY=""
          fi

          {
            printf "%s\n\n---\n\n## Security Report (Trivy)\n\n" "${RELEASE_BODY}"
            if [ -n "${SUMMARY}" ]; then
              printf "%s\n\n" "${SUMMARY}"
            fi
            echo '```text'
            cat trivy-report.txt
            echo '```'
          } > release-body.md

      - name: Upload sfm.war and Trivy report to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sfm.war
            trivy-report.txt
          tag_name: ${{ env.TAG_NAME }}
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
